[package]
name = "remote-host-lab"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "=0.8.6"
worker-sys = "=0.8.6"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = "1"
subtle = "=2.6.1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
