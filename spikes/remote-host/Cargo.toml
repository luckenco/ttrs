[package]
name = "remote-host-lab"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "=0.8.6"
worker-sys = "=0.8.6"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
serde_json = "=1.0.154"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
