[package]
name = "tt"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
signal-hook = "0.3.18"
clap = { version = "4.6.5", features = ["derive"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "perf-inline", "tz-system", "tzdb-bundle-always"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
tempfile = "3.27.0"
thiserror = "2"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", default-features = false }
predicates = { version = "3", default-features = false }
