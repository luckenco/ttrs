[package]
name = "tt"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:crossterm", "dep:ratatui", "dep:signal-hook", "dep:clap", "dep:tempfile", "dep:nucleo-matcher", "dep:unicode-segmentation", "dep:unicode-width", "jiff/tz-system", "dep:uuid"]

[[bin]]
name = "tt"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
crossterm = { optional = true, version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
ratatui = { optional = true, version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
signal-hook = { version = "0.3.18", optional = true }
clap = { optional = true, version = "4.6.5", features = ["derive"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "perf-inline", "tzdb-bundle-always"] }
rusqlite = { optional = true, version = "0.40.1", default-features = false, features = ["bundled", "cache", "hooks", "backup"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"], optional = true }
nucleo-matcher = { version = "0.3.1", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
unicode-width = { version = "0.2.2", optional = true }

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", default-features = false }
predicates = { version = "3", default-features = false }
